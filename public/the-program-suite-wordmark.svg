<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" role="img" aria-labelledby="title desc">
  <title id="title">The Program Suite</title>
  <desc id="desc">The Program Suite custom wordmark with the dimensional electric-blue P mark woven into Program.</desc>
  <rect width="920" height="190" fill="none"/>
