      <path fill="none" stroke="url(#tpsEdgeGradient)" stroke-linejoin="round" stroke-width="7" fill-rule="evenodd" clip-rule="evenodd" d="M141 465V83H318C423 83 484 141 484 234C484 327 423 385 318 385H235V465H141ZM235 303H314C369 303 402 277 402 234C402 191 369 165 314 165H235V303Z"/>
