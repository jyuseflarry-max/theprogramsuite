      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001B4F" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="tpsFaceGradient" x1="148" x2="430" y1="74" y2="430" gradientUnits="userSpaceOnUse">
